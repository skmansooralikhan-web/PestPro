<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>Rate your visit · {{ company.get('companyName','PCT CRM') }}</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ static_url('css/main.css') }}">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">PC</div>
    <h2 style="text-align:center;">{{ company.get('companyName','PCT CRM') }}</h2>
    <p class="muted" style="text-align:center;font-size:12.5px;margin-bottom:20px;">
      How was your recent visit, {{ visit['client_name'] }}?
    </p>

    {% if already %}
      <p style="text-align:center;font-size:13px;">You've already submitted feedback for this visit. Thank you!</p>
    {% else %}
    <form method="POST" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label>Rating</label>
        <div class="row" id="starRow" style="font-size:28px;justify-content:center;gap:6px;">
          {% for i in range(1,6) %}
          <span data-star="{{ i }}" style="cursor:pointer;color:var(--border);">★</span>
          {% endfor %}
        </div>
        <input type="hidden" name="rating" id="ratingInput" required>
      </div>
      <div class="field">
        <label>Comments (optional)</label>
        <textarea name="comment" placeholder="Tell us how the visit went…"></textarea>
      </div>
      <button type="submit" class="btn btn-primary" style="justify-content:center;">Submit Feedback</button>
    </form>
    {% endif %}
  </div>
</div>
<script>
document.querySelectorAll('[data-star]').forEach(star => {
  star.addEventListener('click', () => {
    const val = parseInt(star.dataset.star);
    document.getElementById('ratingInput').value = val;
    document.querySelectorAll('[data-star]').forEach(s => {
      s.style.color = parseInt(s.dataset.star) <= val ? '#e2711d' : 'var(--border)';
    });
  });
});
</script>
</body>
</html>
