{% extends "base.html" %}
{% block title %}Record Payment{% endblock %}
{% block page_title %}Record Payment{% endblock %}

{% block content %}
<div class="card" style="max-width:480px;">
  <div class="row between" style="margin-bottom:14px;">
    <strong>{{ invoice['client_name'] }}</strong>
    <span class="muted">{{ invoice['inv_number'] }}</span>
  </div>
  <div class="notes-box" style="margin-bottom:16px;">
    Balance due: <strong>₹{{ '{:,.2f}'.format(invoice['balance_due']) }}</strong>
  </div>
  <form method="POST" class="stack">
    <div class="field">
      <label>Amount *</label>
      <input type="number" step="0.01" min="0.01" name="amount" required value="{{ '%.2f'|format(invoice['balance_due']) }}">
    </div>
    <div class="field">
      <label>Payment date</label>
      <input type="date" name="payment_date" value="{{ today }}">
    </div>
    <div class="field">
      <label>Payment mode</label>
      <select name="payment_mode">
        {% for m in ['Cash','UPI','NEFT','RTGS','Cheque','Card'] %}
        <option value="{{ m }}">{{ m }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label>Reference number</label>
      <input type="text" name="reference_no" placeholder="UPI txn ID / cheque no / bank ref">
    </div>
    <div class="field">
      <label>Notes</label>
      <textarea name="notes"></textarea>
    </div>
    <div class="row">
      <button type="submit" class="btn btn-primary"><i class="ti ti-check"></i> Record Payment</button>
      <a href="{{ url_for('invoices_bp.detail', invoice_id=invoice['id']) }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
